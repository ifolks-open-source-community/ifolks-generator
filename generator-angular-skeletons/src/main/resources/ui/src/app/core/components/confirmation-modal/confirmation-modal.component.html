<mat-dialog-content>
  <p>{{ 'confirmChoice' | i18n }}</p>
</mat-dialog-content>
<mat-dialog-actions class="d-flex justify-content-end pb-3">
  <button mat-button [mat-dialog-close]="false" color="accent">{{ 'cancel' | i18n }}</button>
  <button mat-flat-button [mat-dialog-close]="true" color="accent">{{ 'ok' | i18n }}</button>
</mat-dialog-actions>
